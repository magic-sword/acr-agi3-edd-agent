[project]
name = "acr-agi3-edd-agent"
version = "0.1.0"
description = "Self-evolving EDD agent for ARC Prize 2026 (ARC-AGI-3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "magic-sword" }
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest-xdist>=3.5.0",
    "matplotlib>=3.8.0",
]
edd = [
    "edd-agent-tools @ git+https://github.com/magic-sword/skill-edd-agent.git#subdirectory=edd-agent-tools",
    "google-adk>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acr_agi3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
pythonpath = ["src"]
